<style>
.pub-list-item.publication-with-image {
  display: grid;
  grid-template-columns: 128px minmax(0, 1fr);
  align-items: start;
  gap: 16px;
  margin-bottom: 24px;
}
.publication-list-image {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 6px;
  background: #f4f5f7;
  border: 0;
  box-shadow: 0 2px 8px rgba(15, 23, 42, .13);
}
.publication-list-image img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.publication-list-copy { min-width: 0; overflow-wrap: anywhere; line-height: 1.4; }
.publication-list-copy > .flex { row-gap: 3px; margin-top: 3px; }
.publication-image-placeholder { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: #8791a0; }
@media (max-width: 767px) {
  .pub-list-item.publication-with-image { grid-template-columns: 80px minmax(0, 1fr); gap: 12px; margin-bottom: 24px; }
}
html.publication-images-off .publication-list-image { display: none; }
html.publication-images-off .pub-list-item.publication-with-image { grid-template-columns: minmax(0, 1fr); gap: 0; }
.publication-index { margin-top: 1.25rem; }
.publication-toolbar { display: flex; justify-content: flex-end; }
.publication-toggle { display: inline-flex; align-items: center; gap: 8px; font-size: .875rem; cursor: pointer; }
.publication-toggle input { width: 2rem; height: 1rem; accent-color: #6366f1; cursor: pointer; }
.publication-toggle input:focus-visible { outline: 2px solid #6366f1; outline-offset: 3px; }

.publication-title { margin: 0 0 4px; font-size: 1rem; line-height: 1.4; font-weight: 650; letter-spacing: -.01em; }
.publication-title a { color: inherit; text-decoration: none; }
.publication-title a:hover { color: #6366f1; }
.publication-labels { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 3px; }
.publication-label { display: inline-block; background: rgba(128,128,128,.10); color: #647080; border-radius: 4px; padding: 1px 6px; font-size: 11px; line-height: 1.4; font-weight: 500; }
.dark .publication-label { color: #cbd5e1; background: rgba(148,163,184,.13); }
.publication-authors { font-size: .875rem; line-height: 1.5; margin-bottom: 1px; }
.publication-venue { font-size: .875rem; line-height: 1.5; opacity: .8; }
.publication-footer .publication-links { margin: 0; font-size: .875rem; row-gap: 4px; }
.pub-list-item.publication-with-image { margin-bottom: 24px; }
.publication-results-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
#publication-result-count { margin: 0; font-size: 13px; color: #747b88; }
.publication-index .pub-year { margin: 1.5rem 0 .65rem; }
.publication-footer { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 6px; }
.publication-footer .publication-labels { margin: 0; }

.publication-footer .publication-labels,
.publication-footer .publication-links { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.publication-footer .publication-label,
.publication-footer .publication-links > a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  box-sizing: border-box;
  min-height: 26px;
  padding: 3px 8px;
  margin: 0;
  border: 0;
  border-radius: 5px;
  font-family: inherit;
  font-size: .875rem;
  font-weight: 500;
  line-height: 20px;
  letter-spacing: 0;
  white-space: nowrap;
  text-decoration: none;
}
.publication-footer .publication-label { background: #f0f2f5; color: #586372; }
.publication-footer .publication-links > a { background: #f0f0ff; color: #5146b8; transition: background-color .15s ease; }
.publication-footer .publication-links > a:hover { background: #e1dfff; color: #37308f; }
.publication-footer .publication-links > a:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
.publication-footer .publication-links svg { width: 14px; height: 14px; flex: 0 0 14px; }
.dark .publication-footer .publication-label { background: #293140; color: #d0d7e2; }
.dark .publication-footer .publication-links > a { background: #302d4c; color: #c4bfff; }
.dark .publication-footer .publication-links > a:hover { background: #413b65; }

.publication-index .pub-year { display: flex; align-items: center; gap: 18px; }
.publication-year-rule { flex: 1; height: 1px; background: #e8eaf0; }
.publication-authors { color: #596170; }
.publication-authors .font-bold { color: #252b36; }
.publication-venue { color: #69717d; opacity: 1; }
.publication-toggle input {
  appearance: none;
  position: relative;
  flex: 0 0 28px;
  width: 28px;
  height: 16px;
  border-radius: 20px;
  background: #cbd0d9;
  border: 0;
  margin: 0;
}
.publication-toggle input:checked { background: #635bca; }
.publication-toggle input::after {
  content: '';
  position: absolute;
  width: 12px;
  height: 12px;
  top: 2px;
  left: 2px;
  background: white;
  border-radius: 50%;
  transition: transform .15s;
}
.publication-toggle input:checked::after { transform: translateX(12px); }
.dark .publication-year-rule { background: #343a46; }
.dark .publication-authors, .dark .publication-venue { color: #b8c0cc; }
.dark .publication-authors .font-bold { color: #eef1f7; }
@media (prefers-reduced-motion: reduce) { .publication-toggle input::after { transition: none; } }

.publication-metadata { font-size: .875rem; line-height: 1.5; }
.publication-metadata .publication-authors, .publication-metadata .publication-venue { display: inline; }
.publication-placeholder-art { display: block; width: 100%; height: 100%; }
.publication-footer .publication-label { background: transparent; color: #687383; padding-left: 0; padding-right: 3px; border-radius: 0; }
.publication-footer .publication-label::before { content: '#'; color: #a0a8b5; font-weight: 400; margin-right: 1px; }
.publication-footer .publication-labels { gap: 9px; }
.dark .publication-footer .publication-label { background: transparent; color: #b8c0cc; }
.publication-citation-stack { display: flex; flex-direction: column; gap: 24px; }
.publication-citation-stack > .pub-list-item.publication-with-image { margin-top: 0; margin-bottom: 0; }
</style>

<script>
(function () {
  const desktop = window.matchMedia('(min-width: 768px)');
  const preferences = {};
  const key = () => desktop.matches ? 'publication-thumbnails' : 'publication-thumbnails-mobile';
  function readPreference() {
    if (key() in preferences) return preferences[key()];
    try {
      const stored = localStorage.getItem(key());
      if (stored === 'on' || stored === 'off') return stored === 'on';
    } catch (_) {}
    return desktop.matches;
  }
  let enabled = readPreference();
  document.documentElement.classList.toggle('publication-images-off', !enabled);
  function init() {
    const toggle = document.getElementById('publication-image-toggle');
    const load = img => { if (img.dataset.src) { img.src = img.dataset.src; delete img.dataset.src; } };
    const observer = 'IntersectionObserver' in window ? new IntersectionObserver(entries => {
      if (!enabled) return;
      entries.forEach(entry => { if (entry.isIntersecting && !entry.target.closest("[hidden]")) { load(entry.target); observer.unobserve(entry.target); } });
    }, {rootMargin: '200px'}) : null;
    function update() {
      document.documentElement.classList.toggle('publication-images-off', !enabled);
      if (toggle) toggle.checked = enabled;
      if (observer) observer.disconnect();
      if (!enabled) return;
      document.querySelectorAll('.publication-list-image img[data-src]').forEach(img => observer ? observer.observe(img) : load(img));
    }
    if (toggle) toggle.addEventListener('change', () => {
      enabled = toggle.checked;
      preferences[key()] = enabled;
      try { localStorage.setItem(key(), enabled ? 'on' : 'off'); } catch (_) {}
      update();
    });
    desktop.addEventListener('change', () => { enabled = readPreference(); update(); });
    window.addEventListener('pageshow', update);
    update();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, {once: true});
  else init();
})();
</script>
